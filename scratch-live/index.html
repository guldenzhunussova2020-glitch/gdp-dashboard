<!doctype html><html lang="kk"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Scratch LIVE</title><style>body{font-family:Arial,sans-serif;background:linear-gradient(120deg,#c7e9ff,#f8d6ff);margin:0;color:#27315d}main{max-width:1000px;margin:auto;padding:24px}.card{background:white;border-radius:24px;padding:24px;margin:18px 0;box-shadow:0 10px 30px #4851a329}button,input,textarea{font:inherit;padding:14px;border-radius:14px;border:2px solid #a6a5dc}button{cursor:pointer;background:#6356da;color:white;font-weight:bold;margin:5px}button:disabled{opacity:.4}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}.choice{background:#f1efff;color:#2c3070;min-height:80px}.chosen{background:#b5f3d9}.stage{background:linear-gradient(#a2e9ff 65%,#8ad28e 65%);padding:15px;border-radius:18px;display:flex;justify-content:space-around}.zone{height:150px;width:30%;border:3px dashed white;background:#ffffff77;color:#27315d}.bar{height:16px;background:#ddd;border-radius:12px;overflow:hidden}.bar i{display:block;background:#38b89b;height:100%}h1{font-size:34px}small{color:#667}#qr{width:200px}textarea,input{max-width:95%}</style><main><h1>🐱 Scratch LIVE · 3-сынып</h1><div id="app"></div></main><script>
const $=x=>document.getElementById(x),params=new URLSearchParams(location.search);let room=params.get('room')||'',key=localStorage.getItem('key-'+(params.get('teacher')||''))||'',id=sessionStorage.getItem('id')||Math.random().toString(36).slice(2),name='',step=0,answers=[],selected=null;sessionStorage.setItem('id',id);
async function api(action,data={}){let r=await fetch('/api?room='+room,action?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,...data})}:{cache:'no-store'});let v=await r.json();if(!r.ok)throw Error(v.error||'Қате');return v}
function home(){$('app').innerHTML='<div class="card"><h2>«Scratch әлеміндегі ізім»</h2><p>5 визуалды тапсырма және сыныптың LIVE нәтижесі</p><button onclick="create()">👩‍🏫 Мұғалім: бөлме ашу</button><button onclick="join()">🎒 Оқушы: қосылу</button></div>'}
async function create(){room=Math.random().toString(36).slice(2,8).toUpperCase();key=Math.random().toString(36).slice(2)+Math.random().toString(36).slice(2);try{await api('create',{key});localStorage.setItem('key-'+room,key);history.replaceState(null,'','?teacher='+room);board()}catch(e){alert(e.message)}}
function join(){$('app').innerHTML='<div class="card"><h2>🎒 Квестке қосылу</h2><p>Бөлме коды</p><input id="code" value="'+room+'"><p>Атың</p><input id="name" maxlength="30" placeholder="Атыңды жаз"><p><button onclick="start()">Бастау</button></p><p id="err"></p></div>'}
async function start(){room=$('code').value.toUpperCase().trim();name=$('name').value.trim();if(!name)return $('err').textContent='Атыңды енгіз';try{await api();await save();step=0;history.replaceState(null,'','?room='+room);question()}catch(e){$('err').textContent=e.message}}
async function save(){return api('submit',{id,name,answers})}
const titles=['Кейіпкерді таңдау','Қадамдарды реттеу','Құралдарды сәйкестендіру','Сахнаны құрастыру','Менің көңіл күйім'];let order=[],match={},pos={},actor='',mood='';
function question(){if(step===5)return $('app').innerHTML='<div class="card"><h1>🏆 Жарайсың!</h1><p>Нәтижең мұғалімнің тақтасына жіберілді.</p></div>';selected=null;order=[];match={};pos={};actor='';mood='';let content='';
if(step===0)content='<p>Жаңа кейіпкер қосатын батырманы таңда.</p><div class="grid">'+['🐱➕ Кейіпкерді таңдау','🚩 Жасыл жалауша','🏞️ Фон таңдау'].map((x,i)=>'<button class="choice" onclick="pick('+i+',0)">'+x+'</button>').join('')+'</div>';
if(step===1)content='<p>Қоянды кітапханадан қосу қадамдарын ретімен бас.</p><div class="grid">'+[[2,'Қоянды таңдау'],[0,'Кейіпкер қосу'],[1,'Кітапхананы ашу']].map(x=>'<button class="choice" id="o'+x[0]+'" onclick="ordering('+x[0]+')">'+x[1]+'</button>').join('')+'</div><p id="sequence"></p><button onclick="question()">↻ Қайта бастау</button>';
if(step===2)content='<p>Әр құралдың қызметін таңда.</p>'+[['Кітапхана','lib'],['Сурет салу','paint'],['Жасыл жалауша','flag']].map(x=>'<p>'+x[0]+' <select id="'+x[1]+'"><option value="">Таңда</option><option value="sprite">Дайын кейіпкерді қосу</option><option value="draw">Өз кейіпкеріңді салу</option><option value="run">Жобаны іске қосу</option></select></p>').join('')+'<button onclick="matching()">Тексеру</button>';
if(step===3)content='<p>Кейіпкерді таңдап, сахнадағы орнын бас.</p><div class="grid">'+[['cat','🐱'],['rabbit','🐰'],['sun','☀️']].map(x=>'<button class="choice" onclick="actor=\''+x[0]+'\';this.style.background=\'#c9f6dd\'">'+x[1]+'</button>').join('')+'</div><div class="stage">'+[['cat','Сол жақ'],['sun','Жоғары'],['rabbit','Оң жақ']].map(x=>'<button class="zone" id="z'+x[0]+'" onclick="place(\''+x[0]+'\')">'+x[1]+'</button>').join('')+'</div><button onclick="checkStage()">Тексеру</button>';
if(step===4)content='<p>Сабақтан алған әсеріңді таңда.</p><div class="grid">'+[['happy','😄 Бәрін түсіндім'],['okay','🙂 Жақсы үйрендім'],['help','🤔 Көмек керек']].map(x=>'<button class="choice" onclick="mood=\''+x[0]+'\';ready(true,\'Пікіріңді жазып аяқта\')">'+x[1]+'</button>').join('')+'</div><p>Мен бүгін үйрендім...</p><textarea id="comment" rows="3"></textarea>';
$('app').innerHTML='<div class="card"><p>'+name+' · '+(step+1)+'/5</p><div class="bar"><i style="width:'+(step*20)+'%"></i></div><h2>'+titles[step]+'</h2>'+content+'<p id="msg"></p><button id="next" disabled onclick="next()">Келесі →</button></div>'}
function ready(ok,msg){selected=ok;$('next').disabled=!ok;$('msg').textContent=msg;$('msg').style.color=ok?'green':'#d24'}
function pick(i,c){ready(i===c,i===c?'Дұрыс!':'Қайта байқап көр')}
function ordering(i){if(order.includes(i))return;order.push(i);$('o'+i).disabled=true;$('sequence').textContent=order.map(x=>x+1).join(' → ');if(order.length===3)ready(order.join()==='0,1,2',order.join()==='0,1,2'?'Дұрыс рет!':'Қайта бастау батырмасын бас')}
function matching(){ready($('lib').value==='sprite'&&$('paint').value==='draw'&&$('flag').value==='run','Жауаптарды тексер')}
function place(z){if(!actor)return;pos[actor]=z;$('z'+z).textContent={cat:'🐱',rabbit:'🐰',sun:'☀️'}[actor]}
function checkStage(){ready(pos.cat==='cat'&&pos.rabbit==='rabbit'&&pos.sun==='sun','Сахнаны тексер')}
async function next(){if(!selected)return;answers.push(step===4?{mood,comment:$('comment').value.trim()}:{correct:true});try{await save();step++;question()}catch(e){$('msg').textContent=e.message}}
function esc(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','"':'&#39;'}[c]))}
function board(){$('app').innerHTML='<div class="card"><h2>📊 LIVE жетістік тақтасы</h2><h1>Бөлме: '+room+'</h1><img id="qr"><p id="url"></p><div id="stats"></div><button onclick="reset()">Нәтижені тазалау</button></div>';let url=location.origin+'/?room='+room;$('url').textContent=url;$('qr').src='https://api.qrserver.com/v1/create-qr-code/?size=200x200&data='+encodeURIComponent(url);load();setInterval(load,2500)}
async function load(){try{let d=await api(),p=Object.values(d.students||{}),done=p.filter(x=>x.answers.length===5),m={happy:0,okay:0,help:0};done.forEach(x=>{let k=x.answers[4]?.mood;if(k in m)m[k]++});$('stats').innerHTML='<div class="grid"><div class="card"><h2>'+p.length+'</h2>Қатысушы</div><div class="card"><h2>'+done.length+'</h2>Аяқтады</div><div class="card"><h2>'+(p.length?Math.round(done.length/p.length*100):0)+'%</h2>Аяқтау деңгейі</div></div><h2>Көңіл күй картасы</h2><p>😄 '+m.happy+' · 🙂 '+m.okay+' · 🤔 '+m.help+'</p><h2>Оқушылар</h2><div class="grid">'+p.map(x=>'<div class="card"><b>'+esc(x.name)+'</b><p>'+x.answers.length+'/5 тапсырма</p><div class="bar"><i style="width:'+(x.answers.length*20)+'%"></i></div></div>').join('')+'</div><h2>Пікірлер</h2>'+done.map(x=>'<p>'+esc(x.name)+': '+esc(x.answers[4]?.comment||'')+'</p>').join('')}catch(e){$('stats').textContent=e.message}}
async function reset(){if(confirm('Нәтижені тазалаймыз ба?')){await api('reset',{key});load()}}
if(params.has('teacher')){room=params.get('teacher');key=localStorage.getItem('key-'+room);if(key)board();else home()}else if(room)join();else home();
</script></html>
