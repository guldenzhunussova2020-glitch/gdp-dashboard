<!doctype html><html lang="kk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Алтын асық — Күміс асық</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#224875,#071427 75%);font-family:Arial,sans-serif;color:white;display:grid;place-items:center;text-align:center}.wrap{width:min(900px,94vw);padding:30px}h1{font-size:clamp(34px,6vw,66px);margin:20px 0}.sub{color:#b7d5ef;font-size:20px}.stage{display:flex;gap:20px;justify-content:center;flex-wrap:wrap;margin:38px auto}.card{width:min(350px,43vw);min-width:145px;min-height:270px;border:2px solid #61738a;border-radius:25px;background:#ffffff0b;padding:25px 10px;transition:.5s;opacity:.55}.card.on{opacity:1;transform:scale(1.04)}.gold.on{border-color:#ffdc62;box-shadow:0 0 50px #ffcd3670;background:#75541c55}.silver.on{border-color:#e5f1ff;box-shadow:0 0 50px #b5d7ff66;background:#7189a044}.asyq{font-size:110px;filter:drop-shadow(0 8px 8px #0006)}.gold .asyq{color:#ffcf45}.silver .asyq{color:#d9e6f7}.name{font-size:clamp(24px,4vw,39px);font-weight:bold}.room{font-size:19px;margin-top:10px}button{border:0;border-radius:14px;padding:17px 24px;margin:5px;background:#3be1ac;color:#06213b;font-weight:bold;font-size:19px;cursor:pointer}.secondary{background:#d9e9ff}#result{font-size:clamp(22px,4vw,40px);color:#7fffc9;min-height:50px;font-weight:bold}.small{color:#a6bfd7;margin-top:22px}@media(max-width:500px){.card{min-height:220px}.asyq{font-size:75px}}</style></head><body><main class="wrap"><div style="letter-spacing:4px;color:#91dfff">ИНТЕРАКТИВТІ ТОПҚА БӨЛУ</div><h1>Алтын асық — Күміс асық</h1><div class="sub" id="status">Топтарға бөлуді бастауға дайын</div><div class="stage"><div class="card gold" id="gold"><div class="asyq">♟</div><div class="name">Алтын асық</div><div class="room">А секциясы · 314 кабинет</div></div><div class="card silver" id="silver"><div class="asyq">♟</div><div class="name">Күміс асық</div><div class="room">Б секциясы · 315 кабинет</div></div></div><div id="result"></div><button id="start">Бөлуді бастау</button><button class="secondary" id="reset">Қайта бастау</button><button class="secondary" id="full">Толық экран</button><div class="small">Музыкалық сүйемелдеу және анимациялық таныстыру</div></main><script>let ctx,timers=[];const g=document.getElementById('gold'),s=document.getElementById('silver'),status=document.getElementById('status'),result=document.getElementById('result'),start=document.getElementById('start');function tone(f){try{ctx??=new(window.AudioContext||window.webkitAudioContext)();ctx.resume();let o=ctx.createOscillator(),v=ctx.createGain(),t=ctx.currentTime;o.type='sine';o.frequency.value=f;o.connect(v);v.connect(ctx.destination);v.gain.setValueAtTime(.0001,t);v.gain.exponentialRampToValueAtTime(.06,t+.03);v.gain.exponentialRampToValueAtTime(.0001,t+.35);o.start(t);o.stop(t+.36)}catch(e){}}function reset(){timers.forEach(clearTimeout);timers=[];g.classList.remove('on');s.classList.remove('on');status.textContent='Топтарға бөлуді бастауға дайын';result.textContent='';start.disabled=false}start.onclick=()=>{reset();start.disabled=true;status.textContent='Алтын асық тобы таныстырылуда…';tone(523);timers.push(setTimeout(()=>{g.classList.add('on');tone(659)},900));timers.push(setTimeout(()=>{status.textContent='Күміс асық тобы таныстырылуда…';s.classList.add('on');tone(784)},2500));timers.push(setTimeout(()=>{tone(1046);status.textContent='Екі топ дайын!';result.textContent='Топтарға бөлу сәтті аяқталды!';start.disabled=false},4100))};document.getElementById('reset').onclick=reset;document.getElementById('full').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.();</script></body></html>
